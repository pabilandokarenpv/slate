<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Whitekernel</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <div id="sidebar-scrim" class="hidden"></div>
    <div id="sidebar">
      <div id="brand">
        <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="M9 9h6v6H9z"/></svg>
        Whitekernel
      </div>
      <button id="new-chat-btn" class="sidebar-btn">
        <svg class="icon"><use href="#icon-plus"/></svg>
        New chat
      </button>
      <div id="sidebar-tools">
        <button id="sidebar-artifact-btn" class="sidebar-btn">
          <svg class="icon"><use href="#icon-artifact"/></svg>
          Artifacts
        </button>
        <button id="sidebar-code-btn" class="sidebar-btn">
          <svg class="icon"><use href="#icon-code"/></svg>
          Kernel Code
        </button>
      </div>
      <div id="session-list"></div>
      <div id="sidebar-footer">
        <span>own from-scratch model</span>
        <button id="theme-toggle" aria-label="Toggle theme">
          <svg class="icon" id="theme-icon"><use href="#icon-moon"/></svg>
        </button>
      </div>
    </div>
    <div id="chat-pane">
      <div id="header">
        <button id="sidebar-toggle" aria-label="Toggle chat history">
          <svg class="icon"><use href="#icon-menu"/></svg>
        </button>
        <div id="header-text">
          <h1 id="session-title">New chat</h1>
          <span id="subtitle">chat + live artifacts + kernel code</span>
        </div>
      </div>
      <div id="messages"></div>
      <form id="input-form">
        <textarea id="input" placeholder="Message Whitekernel..." rows="1"></textarea>
        <button type="submit" id="send-btn" aria-label="Send">
          <svg class="icon"><use href="#icon-up"/></svg>
        </button>
      </form>
    </div>
    <div id="side-panel" class="hidden">
      <div id="panel-tabs">
        <button class="panel-tab active" data-panel="artifact">
          <svg class="icon"><use href="#icon-artifact"/></svg>
          Artifact
        </button>
        <button class="panel-tab" data-panel="kernel-code">
          <svg class="icon"><use href="#icon-code"/></svg>
          Kernel Code
        </button>
        <button id="panel-close" aria-label="Close panel">
          <svg class="icon"><use href="#icon-close"/></svg>
        </button>
      </div>
      <div id="artifact-panel" class="panel-view active">
        <div id="artifact-title-row"><span id="artifact-title">Artifact</span></div>
        <iframe id="artifact-frame" sandbox="allow-scripts"></iframe>
      </div>
      <div id="kernel-code-panel" class="panel-view">
        <div id="kernel-code-toolbar">
          <select id="kernel-code-lang">
            <option value="html">HTML</option>
            <option value="js">JavaScript</option>
          </select>
          <button id="kernel-code-run">
            <svg class="icon" style="width:13px;height:13px"><use href="#icon-play"/></svg>
            Run
          </button>
        </div>
        <textarea id="kernel-code-editor" spellcheck="false" placeholder="// write or paste code here, then Run"></textarea>
        <iframe id="kernel-code-frame" sandbox="allow-scripts"></iframe>
      </div>
    </div>
  </div>

  <!-- Inline SVG icon sprite — crisp, Apple SF-Symbols-style thin-stroke icons,
       no icon font or image requests. -->
  <svg style="display:none">
    <defs>
      <g id="icon-plus"><path d="M12 5v14M5 12h14"/></g>
      <g id="icon-menu"><path d="M4 7h16M4 12h16M4 17h16"/></g>
      <g id="icon-up"><path d="M12 19V5M5 12l7-7 7 7"/></g>
      <g id="icon-close"><path d="M6 6l12 12M18 6L6 18"/></g>
      <g id="icon-play"><path d="M6 4l14 8-14 8V4z"/></g>
      <g id="icon-artifact"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12h8M12 8v8"/></g>
      <g id="icon-code"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></g>
      <g id="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></g>
      <g id="icon-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></g>
    </defs>
  </svg>

  <script src="/app.js"></script>
</body>
</html>
