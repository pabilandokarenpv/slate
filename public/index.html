<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Whitekernel</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <div id="sidebar-scrim" class="hidden"></div>
    <div id="sidebar">
      <div id="brand">
        <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="3" width="18" height="18" rx="7"/><path d="M9 9h6v6H9z"/></svg>
        Whitekernel
      </div>
      <button id="new-chat-btn" class="sidebar-btn primary">
        <svg class="icon" viewBox="0 0 24 24"><use href="#icon-plus"/></svg>
        New chat
      </button>
      <div class="sidebar-section">
        <button id="sidebar-artifact-btn" class="sidebar-btn">
          <svg class="icon" viewBox="0 0 24 24"><use href="#icon-artifact"/></svg>
          Artifacts
        </button>
        <button id="sidebar-code-btn" class="sidebar-btn">
          <svg class="icon" viewBox="0 0 24 24"><use href="#icon-code"/></svg>
          Kernel Code
        </button>
        <button id="nav-projects-btn" class="sidebar-btn" data-view="projects">
          <svg class="icon" viewBox="0 0 24 24"><use href="#icon-projects"/></svg>
          Projects
        </button>
        <button id="nav-bots-btn" class="sidebar-btn" data-view="bots">
          <svg class="icon" viewBox="0 0 24 24"><use href="#icon-bots"/></svg>
          Bots
        </button>
        <button id="nav-cron-btn" class="sidebar-btn" data-view="cron">
          <svg class="icon" viewBox="0 0 24 24"><use href="#icon-cron"/></svg>
          Cron Jobs
        </button>
      </div>
      <div id="session-list"></div>
      <div id="sidebar-footer">
        <span>own from-scratch model</span>
        <button id="theme-toggle" aria-label="Toggle theme">
          <svg class="icon" viewBox="0 0 24 24" id="theme-icon"><use href="#icon-moon"/></svg>
        </button>
      </div>
    </div>
    <div id="chat-pane">
      <div id="header">
        <button id="sidebar-toggle" aria-label="Toggle sidebar">
          <svg class="icon" viewBox="0 0 24 24" id="sidebar-toggle-icon"><use href="#icon-sidebar-open"/></svg>
        </button>
        <div id="header-text">
          <h1 id="session-title">New chat</h1>
        </div>
      </div>
      <div id="messages"></div>
      <form id="input-form">
        <textarea id="input" placeholder="Message Whitekernel..." rows="1"></textarea>
        <button type="submit" id="send-btn" aria-label="Send">
          <svg class="icon" viewBox="0 0 24 24"><use href="#icon-up"/></svg>
        </button>
      </form>
    </div>
    <div id="side-panel" class="hidden">
      <div id="panel-tabs">
        <button class="panel-tab active" data-panel="artifact">
          <svg class="icon" viewBox="0 0 24 24"><use href="#icon-artifact"/></svg>
          Artifact
        </button>
        <button class="panel-tab" data-panel="kernel-code">
          <svg class="icon" viewBox="0 0 24 24"><use href="#icon-code"/></svg>
          Kernel Code
        </button>
        <button id="panel-close" aria-label="Close panel">
          <svg class="icon" viewBox="0 0 24 24"><use href="#icon-close"/></svg>
        </button>
      </div>
      <div id="artifact-panel" class="panel-view active">
        <div id="artifact-title-row"><span id="artifact-title">Artifact</span></div>
        <iframe id="artifact-frame" sandbox="allow-scripts"></iframe>
      </div>
      <div id="kernel-code-panel" class="panel-view">
        <div id="kernel-code-toolbar">
          <select id="kernel-code-lang">
            <option value="html">HTML</option>
            <option value="js">JavaScript</option>
          </select>
          <button id="kernel-code-run">
            <svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><use href="#icon-play"/></svg>
            Run
          </button>
        </div>
        <textarea id="kernel-code-editor" spellcheck="false" placeholder="// write or paste code here, then Run"></textarea>
        <iframe id="kernel-code-frame" sandbox="allow-scripts"></iframe>
      </div>
    </div>

    <!-- Projects: group chats, each with its own instructions -->
    <div id="projects-view" class="feature-view">
      <div class="feature-header">
        <div>
          <h2>Projects</h2>
          <p>Group related chats and give them shared instructions.</p>
        </div>
        <button id="projects-new-btn" class="feature-new-btn">
          <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#icon-plus"/></svg>
          New project
        </button>
      </div>
      <div id="projects-grid" class="card-grid"></div>
    </div>

    <!-- Bots: custom assistants with their own name + instructions -->
    <div id="bots-view" class="feature-view">
      <div class="feature-header">
        <div>
          <h2>Bots</h2>
          <p>Create a custom bot with its own persona and instructions.</p>
        </div>
        <button id="bots-new-btn" class="feature-new-btn">
          <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#icon-plus"/></svg>
          New bot
        </button>
      </div>
      <div id="bots-grid" class="card-grid"></div>
    </div>

    <!-- Cron Jobs: scheduled prompts, run server-side on a real schedule -->
    <div id="cron-view" class="feature-view">
      <div class="feature-header">
        <div>
          <h2>Cron Jobs</h2>
          <p>Schedule a prompt to run automatically, even when this tab is closed.</p>
        </div>
        <button id="cron-new-btn" class="feature-new-btn">
          <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><use href="#icon-plus"/></svg>
          New cron job
        </button>
      </div>
      <div id="cron-grid" class="card-grid"></div>
    </div>
  </div>

  <!-- Shared modal for creating a Project / Bot / Cron job -->
  <div id="modal-scrim" class="hidden">
    <div id="modal-box">
      <h3 id="modal-title">New item</h3>
      <div id="modal-fields"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn cancel">Cancel</button>
        <button id="modal-confirm" class="modal-btn confirm">Create</button>
      </div>
    </div>
  </div>

  <!-- Inline SVG icon sprite — crisp, Apple SF-Symbols-style thin-stroke icons,
       no icon font or image requests. -->
  <svg style="display:none">
    <defs>
      <g id="icon-plus"><path d="M12 5v14M5 12h14"/></g>
      <g id="icon-up"><path d="M12 19V5M5 12l7-7 7 7"/></g>
      <g id="icon-close"><path d="M6 6l12 12M18 6L6 18"/></g>
      <g id="icon-play"><path d="M6 4l14 8-14 8V4z"/></g>
      <g id="icon-artifact"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="M8 12h8M12 8v8"/></g>
      <g id="icon-code"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></g>
      <g id="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></g>
      <g id="icon-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></g>
      <g id="icon-projects"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></g>
      <g id="icon-bots"><rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V4M9 4h6"/><circle cx="9" cy="14" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.2" fill="currentColor" stroke="none"/></g>
      <g id="icon-cron"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g>
      <g id="icon-trash"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></g>
      <g id="icon-sidebar-open"><rect x="3.5" y="4.5" width="17" height="15" rx="4.5"/><path d="M9.5 4.5v15"/></g>
      <g id="icon-sidebar-closed"><rect x="3.5" y="4.5" width="17" height="15" rx="4.5"/><path d="M9.5 4.5v15"/><path d="M13 10l2 2-2 2"/></g>
    </defs>
  </svg>

  <script src="/app.js"></script>
</body>
</html>
